<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Voice Showcase — one sentence, eight free AI voices</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { flex: none; width: 1920px; height: 1080px; transform-origin: center; }
  #hud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
         font: 13px "Segoe UI", sans-serif; color: #ccc; background: rgba(20,20,30,.85); padding: 8px 14px; border-radius: 10px; z-index: 10; }
  #hud button { background: #2a2a3a; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #hud input { width: 360px; }
  body.clean #hud { display: none; }
  #start { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; font: 600 28px "Segoe UI", sans-serif; color: #F3EFE6; background: rgba(11,14,26,.55); cursor: pointer; letter-spacing: .02em; }
</style>
</head>
<body>
<div id="start">&#9654;&nbsp; Click or press Space to play with sound</div>
<div id="wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg></div>
<div id="hud">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" value="0" />
  <span id="time">0.0s</span>
  <button id="mute">Sound on</button>
  <span style="opacity:.6">Space play/pause · R restart · M mute · H hide controls · F11 fullscreen</span>
</div>
<script src="voice.js"></script>
<script>
// ============================================================ constants
const W = 1920, H = 1080, FPS = 30;
const COL = {
  night: '#0B0E1A', panel: '#151A2E', line: '#2A3150', light: '#F3EFE6', muted: '#8C93AD',
  parch: '#F1E6CF', parch2: '#E6D6B4', ink: '#2B2118', red: '#A23B2A', gold: '#FFC857',
  teal: '#2EC4B6', pink: '#F25C9C', wood: '#8B5A2B', steel: '#8A8F9C',
};
const SANS = "'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif";
const SERIF = "'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif";
const MONO = "'Cascadia Code',Consolas,monospace";

// ============================================================ maths / easing
const clamp01 = t => Math.max(0, Math.min(1, t));
const clamp = (t, a, b) => Math.max(a, Math.min(b, t));
const mix = (a, b, t) => a + (b - a) * t;
const mixP = (p, q, t) => [mix(p[0], q[0], t), mix(p[1], q[1], t)];
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (f, a, b, e) => { const t = clamp01((f - a) / (b - a)); return e ? e(t) : t; };
function spring(fr, { damping = 12, stiffness = 170, mass = 1 } = {}) {
  if (fr <= 0) return 0;
  let x = 0, v = 0; const steps = Math.ceil(fr * 4), dt = fr / FPS / steps;
  for (let i = 0; i < steps; i++) { const a = (-stiffness * (x - 1) - damping * v) / mass; v += a * dt; x += v * dt; }
  return x;
}
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const n1 = v => (+v).toFixed(1);
const n3 = v => (+v).toFixed(3);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const quad = (a, c, b, t) => { const u = 1 - t; return [u*u*a[0] + 2*u*t*c[0] + t*t*b[0], u*u*a[1] + 2*u*t*c[1] + t*t*b[1]]; };
const quadD = (a, c, b, t) => [2*(1-t)*(c[0]-a[0]) + 2*t*(b[0]-c[0]), 2*(1-t)*(c[1]-a[1]) + 2*t*(b[1]-c[1])];
function limb(a, ang, len) { const r = ang * Math.PI / 180; return [a[0] + Math.sin(r) * len, a[1] + Math.cos(r) * len]; }
function ik(a, b, l1, l2, bend = -1) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d = Math.max(1e-3, Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01));
  const c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
  const t = Math.atan2(dy, dx) - bend * Math.acos(Math.max(-1, Math.min(1, c)));
  return [a[0] + Math.cos(t) * l1, a[1] + Math.sin(t) * l1];
}
function segX(a, b, c, d) {
  const r = [b[0]-a[0], b[1]-a[1]], s = [d[0]-c[0], d[1]-c[1]];
  const den = r[0]*s[1] - r[1]*s[0]; if (Math.abs(den) < 1e-6) return null;
  const t = ((c[0]-a[0])*s[1] - (c[1]-a[1])*s[0]) / den, u = ((c[0]-a[0])*r[1] - (c[1]-a[1])*r[0]) / den;
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? [a[0] + t*r[0], a[1] + t*r[1]] : null;
}

// ============================================================ text + path helpers
const mctx = document.createElement('canvas').getContext('2d');
function measure(str, size, weight, font, italic) { mctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${font}`; return mctx.measureText(str).width; }

// Word-by-word staggered reveal. segs: [{t, fill?, italic?}]
function words(segs, cx, y, f, delay, o = {}) {
  const { size = 64, weight = 600, font = SANS, stagger = 3, dur = 18, dist = 30, op = 1 } = o;
  const items = [];
  segs.forEach(sg => sg.t.split(' ').forEach(w => { if (w) items.push({ w, fill: sg.fill || o.fill || COL.light, italic: sg.italic ?? o.italic ?? false }); }));
  const sp = measure(' ', size, weight, font, false);
  const widths = items.map(it => measure(it.w, size, weight, font, it.italic));
  let x = cx - (widths.reduce((a, b) => a + b, 0) + sp * (items.length - 1)) / 2;
  let out = '';
  items.forEach((it, i) => {
    const t = prog(f, delay + i * stagger, delay + i * stagger + dur, eout);
    if (t > 0) out += `<text x="${n1(x)}" y="${n1(y + (1 - t) * dist)}" opacity="${n3(t * op)}" font-family="${font}" font-size="${size}" font-weight="${weight}" fill="${it.fill}"${it.italic ? ' font-style="italic"' : ''}>${esc(it.w)}</text>`;
    x += widths[i] + sp;
  });
  return out;
}
function stroke(d, t, attrs = '') {
  if (t <= 0) return '';
  return `<path d="${d}" fill="none" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${n3(1 - t)}" ${attrs}/>`;
}
const svgNS = 'http://www.w3.org/2000/svg';
const hidden = document.createElementNS(svgNS, 'svg');
hidden.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden';
document.body.appendChild(hidden);
const pathCache = new Map();
function pointAt(d, t) {
  let p = pathCache.get(d);
  if (!p) { p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', d); hidden.appendChild(p); p._len = p.getTotalLength(); pathCache.set(d, p); }
  const q = p.getPointAtLength(p._len * clamp01(t)); return [q.x, q.y];
}
function partial(d, t, n = 60) {
  const pts = []; for (let i = 0; i <= n; i++) { const q = pointAt(d, t * i / n); pts.push(n1(q[0]) + ',' + n1(q[1])); } return pts.join(' ');
}

// ============================================================ backgrounds
const DEFS = `<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".06"/></pattern></defs>`;
const bgNight = () => `<rect width="${W}" height="${H}" fill="${COL.night}"/><rect width="${W}" height="${H}" fill="url(#dots)"/>`;
const nightRect = (x, w) => w > 0 ? `<rect x="${n1(x)}" y="0" width="${n1(w)}" height="${H}" fill="${COL.night}"/><rect x="${n1(x)}" y="0" width="${n1(w)}" height="${H}" fill="url(#dots)"/>` : '';
const SPECKS = Array.from({ length: 70 }, (_, i) => `<circle cx="${n1(rnd(i) * W)}" cy="${n1(rnd(i + 99) * H)}" r="${n1(1 + rnd(i + 7) * 2.5)}" fill="${COL.ink}" opacity="${n3(0.04 + rnd(i + 3) * 0.06)}"/>`).join('');
const bgParch = () => `<rect width="${W}" height="${H}" fill="${COL.parch}"/>${SPECKS}`;
function stars(F, drift = 0) {
  let s = '';
  for (let i = 0; i < 120; i++) {
    const x = (((rnd(i) * W - drift * (0.3 + rnd(i + 5) * 0.7)) % W) + W) % W;
    const tw = .35 + .65 * Math.abs(Math.sin(F * 0.05 + i));
    s += `<circle cx="${n1(x)}" cy="${n1(rnd(i + 50) * H)}" r="${n1(0.8 + rnd(i + 9) * 1.8)}" fill="#fff" opacity="${n3(tw * .8)}"/>`;
  }
  return s;
}

// ============================================================ Microsoft 365 Copilot-style mark (two interlocking ribbons, 180° symmetric)
const CP_A = 'M70 325 L160 325 Q173 325 181 300 L216 185 Q224 155 250 155 L385 155 C350 155 348 110 340 82 C330 50 315 40 290 40 L150 40 Q115 40 105 75 L40 290 Q28 325 70 325 Z';
const CP_FOLD = 'M262 40 L290 40 C315 40 330 50 340 82 C348 110 350 155 385 155 L250 155 Q224 155 220 170 Q232 90 262 40 Z';
const CP_DEFS = `
<linearGradient id="cpA" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="110" y2="325"><stop offset="0" stop-color="#38C2F8"/><stop offset=".3" stop-color="#1C8FE3"/><stop offset=".62" stop-color="#4DB57A"/><stop offset="1" stop-color="#F7C51E"/></linearGradient>
<linearGradient id="cpAf" gradientUnits="userSpaceOnUse" x1="250" y1="60" x2="380" y2="150"><stop offset="0" stop-color="#0B2BA8"/><stop offset=".6" stop-color="#1552D6"/><stop offset="1" stop-color="#1E7BEA"/></linearGradient>
<linearGradient id="cpB" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="110" y2="325"><stop offset="0" stop-color="#FFB16A"/><stop offset=".38" stop-color="#F7738A"/><stop offset=".7" stop-color="#E4569A"/><stop offset="1" stop-color="#B04FE6"/></linearGradient>
<linearGradient id="cpBf" gradientUnits="userSpaceOnUse" x1="250" y1="60" x2="380" y2="150"><stop offset="0" stop-color="#C92E1C"/><stop offset=".55" stop-color="#F0582E"/><stop offset="1" stop-color="#FF9A5A"/></linearGradient>
<linearGradient id="cpGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="cpSheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cpClip"><path d="${CP_A}"/><path d="${CP_FOLD}"/><path d="${CP_A}" transform="rotate(180 240 240)"/><path d="${CP_FOLD}" transform="rotate(180 240 240)"/></clipPath>
<filter id="cpGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>`;
let GF = 0; // global frame, set by render() — drives the idle sheen
function mark(cx, cy, size, t = 1, spin = 0) {
  if (size <= 0.5) return '';
  const k = size / 360, e = eout(clamp01(t)), sep = mix(90, 0, e);
  const draw = prog(t, 0, .6, eio), fill = prog(t, .3, .9), fold = prog(t, .55, 1, eout);
  const half = (id, rot) => {
    const off = rot ? `translate(${n1(sep)} ${n1(sep * .55)})` : `translate(${n1(-sep)} ${n1(-sep * .55)})`;
    const R = rot ? ' rotate(180 240 240)' : '';
    return `<g transform="${off}${R}"><path d="${CP_A}" fill="url(#${id})" fill-opacity="${n3(fill)}" stroke="url(#${id})" stroke-width="10" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${n3(1 - draw)}"/><path d="${CP_A}" fill="url(#cpGloss)" opacity="${n3(fill * .7)}"/><path d="${CP_FOLD}" fill="url(#${id}f)" opacity="${n3(fold)}"/></g>`;
  };
  const sweep = ((GF % 150) / 150) * 900 - 250;
  const sheen = t >= 1 ? `<g clip-path="url(#cpClip)"><rect x="${n1(sweep)}" y="-40" width="160" height="560" fill="url(#cpSheen)" transform="rotate(20 240 240)" opacity=".6"/></g>` : '';
  const glow = `<g filter="url(#cpGlow)" opacity="${n3(.35 * fill)}"><path d="${CP_A}" fill="url(#cpA)"/><path d="${CP_A}" fill="url(#cpB)" transform="rotate(180 240 240)"/></g>`;
  return `<g transform="translate(${n1(cx)} ${n1(cy)}) rotate(${n1(spin)}) scale(${n3(k)}) translate(-240 -240)">${size > 120 ? glow : ''}${half('cpA', false)}${half('cpB', true)}${sheen}</g>`;
}function companion(x, y, size, F) {
  let c = `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(Math.min(size * 1.9, 200))}" fill="${COL.light}" opacity=".05"/><circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(Math.min(size * 1.15, 160))}" fill="${COL.light}" opacity=".06"/>`;
  for (let k = 1; k < 7; k++) c += `<circle cx="${n1(x - k * 18 * size / 70)}" cy="${n1(y + Math.sin(F * .2 - k * .8) * 8)}" r="${n1((5 - k * .6) * size / 70)}" fill="${['#1C8FE3', '#E4569A', '#F7C51E'][k % 3]}" opacity="${n3(.6 - k * .08)}"/>`;
  return c + mark(x, y, size, 1, Math.sin(F * .05) * 10);
}


// ============================================================ voice showcase: helpers
function txt(x, y, s, o = {}) {
  const { size = 32, weight = 600, font = SANS, fill = COL.light, anchor = 'start', op = 1, ls = 0, italic = false, extra = '' } = o;
  if (op <= 0.001) return '';
  return `<text x="${n1(x)}" y="${n1(y)}" font-family="${font}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" opacity="${n3(op)}"${ls ? ` letter-spacing="${ls}"` : ''}${italic ? ' font-style="italic"' : ''}${extra}>${esc(String(s))}</text>`;
}
const pillW = (s, size = 24, weight = 600, font = SANS, padX = 18) => measure(s, size, weight, font) + padX * 2;
function pill(x, y, s, o = {}) {
  const { size = 24, weight = 600, font = SANS, fill = COL.light, bg = COL.panel, bgOp = 1, stroke = COL.line, op = 1, padX = 18, anchor = 'start', sc = 1 } = o;
  if (op <= 0.001 || sc <= 0.001) return '';
  const h = o.h || size * 1.75, w = pillW(s, size, weight, font, padX), cx = anchor === 'middle' ? x : x + w / 2;
  return `<g opacity="${n3(op)}" transform="translate(${n1(cx)} ${n1(y)}) scale(${n3(sc)})"><rect x="${n1(-w / 2)}" y="${n1(-h / 2)}" width="${n1(w)}" height="${n1(h)}" rx="${n1(h / 2)}" fill="${bg}" fill-opacity="${n3(bgOp)}" stroke="${stroke}" stroke-width="2"/><text x="0" y="${n1(size * 0.35)}" text-anchor="middle" font-family="${font}" font-size="${size}" font-weight="${weight}" fill="${fill}">${esc(s)}</text></g>`;
}
function wrap(str, maxW, size, weight = 600, font = SANS) {
  const out = [[]]; let w = 0; const sp = measure(' ', size, weight, font);
  str.split(' ').forEach(t => { const tw = measure(t, size, weight, font); if (out[out.length - 1].length && w + sp + tw > maxW) { out.push([]); w = 0; } w += (out[out.length - 1].length ? sp : 0) + tw; out[out.length - 1].push(t); });
  return out;
}
const fadeIO = (f, d, a = 10, b = 12) => Math.min(prog(f, 0, a), 1 - prog(f, d - b, d));

// ============================================================ engines + clips
const ENG = [
  { id: 'sapi', name: 'Windows SAPI', maker: 'Microsoft · built into Windows', col: '#7FB2FF', tags: ['Built in', 'Offline', 'Since 1995'] },
  { id: 'piper', name: 'Piper', maker: 'Open Home Foundation · Rhasspy', col: '#8BE38B', tags: ['ONNX', 'GPL-3.0', 'Hundreds of voices'] },
  { id: 'kitten', name: 'Kitten TTS', maker: 'KittenML · nano model', col: '#FF9ED2', tags: ['< 25 MB', 'Apache-2.0', 'CPU'] },
  { id: 'kokoro', name: 'Kokoro', maker: 'hexgrad · Kokoro-82M', col: COL.gold, tags: ['82M params', 'Apache-2.0', '54 voices'] },
  { id: 'super', name: 'Supertonic', maker: 'Supertone · on-device ONNX', col: COL.teal, tags: ['MIT code · OpenRAIL-M weights', '31 languages'] },
  { id: 'pocket', name: 'Pocket TTS', maker: 'Kyutai · 100M params', col: '#B59BFF', tags: ['CPU real-time', 'MIT code · CC-BY-4.0 weights'] },
  { id: 'cb', name: 'Chatterbox', maker: 'Resemble AI · 500M params', col: '#FF7A59', tags: ['MIT', 'Emotion control', 'Voice cloning'] },
  { id: 'edge', name: 'Edge TTS', maker: 'Microsoft neural voices · edge-tts', col: '#4CD7FF', tags: ['Cloud', 'No API key', '70+ languages'] },
];
const EI = Object.fromEntries(ENG.map((e, i) => [e.id, i]));
const engOf = k => ENG[EI[k.replace(/^[rf]_/, '').replace(/\d+$/, '')]];
const XDEFS = ENG.map(e => `<radialGradient id="g_${e.id}"><stop offset="0" stop-color="${e.col}" stop-opacity=".20"/><stop offset=".6" stop-color="${e.col}" stop-opacity=".05"/><stop offset="1" stop-color="${e.col}" stop-opacity="0"/></radialGradient>`).join('')
  + `<radialGradient id="g_white"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
const glow = (id, cx, cy, r, op = 1) => op > .001 ? `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(r)}" fill="url(#g_${id})" opacity="${n3(op)}"/>` : '';
const bg = (F, id, op = 1, cx = 480, cy = 420) => bgNight() + `<g opacity=".35">${stars(F, F * .4)}</g>` + (id ? glow(id, cx, cy, 900, op) : '');
const VOICE_ID = {
  r_sapi: 'Microsoft David Desktop', r_piper: 'en_US-ryan-high', r_kitten: 'expr-voice-3-m', r_kokoro: 'bm_george', r_super: 'F2', r_pocket: 'alba', r_cb: 'default voice', r_edge: 'en-US-AvaMultilingualNeural',
  sapi: 'Microsoft David Desktop', piper1: 'en_US-ryan-high', piper2: 'en_GB-northern_english_male-medium', kitten: 'expr-voice-4-f',
  kokoro1: 'af_heart', kokoro2: 'bm_george', kokoro3: 'ff_siwis', super1: 'M1 · English', super2: 'F1 · Spanish', super3: 'M3 · German', super4: 'F3 · Korean',
  pocket1: 'javert', pocket2: 'alba', cb1: 'exaggeration 0.25', cb2: 'exaggeration 1.3', cb3: 'zero-shot clone', edge1: 'en-US-AvaMultilingualNeural', edge2: 'en-AU-NatashaNeural',
};
const SUBS = {
  sapi: 'Hello. I am Microsoft David. I come built into Windows, and I work completely offline.',
  piper1: "I'm Piper. I'm small enough to run on a Raspberry Pi, and I come in hundreds of voices,",
  piper2: 'including this one, from the north of England.',
  kitten: "I'm Kitten TTS. My whole model is under 25 megabytes.",
  kokoro1: "I'm Kokoro. Just 82 million parameters,", kokoro2: 'more than 50 voices,', kokoro3: 'et je parle aussi français.',
  super1: "I'm Supertonic. I speak 31 languages.", super2: 'Hablo español,', super3: 'spreche Deutsch,', super4: '한국어도 할 수 있어요.',
  pocket1: "I'm Pocket TTS, from Kyutai. I talk faster than real time, on a laptop CPU.", pocket2: 'No graphics card required.',
  cb1: "Hi, I'm Chatterbox. I can keep things calm, and measured.", cb2: 'Or I can get really, really excited about it!',
  cb3: 'I can even clone a voice from a few seconds of audio. Sound familiar?',
  edge1: "And I'm a Microsoft neural voice, through edge-tts. Hundreds of voices, in over 70 languages.", edge2: "G'day from Australia, too!",
};
const TRANS = { kokoro3: '“…and I speak French too.”', super2: '“I speak Spanish,”', super3: '“…speak German,”', super4: '“I can speak Korean too.”' };
const KR = "'Malgun Gothic','Segoe UI',sans-serif";

// ============================================================ timeline builder (frames, relative to scene)
const LEN = k => (window.VENV && VENV[k]) ? VENV[k].length : Math.round(((window.VDUR || {})[k] || 1) * FPS);
function mk(name, fn) { const s = { name, cues: [], sfx: [], t: 0, at: {} }; s.render = (f, d) => fn(f, d, s); return s; }
function say(s, k, gap = 0) { s.cues.push([k, s.t]); s.at[k] = s.t; s.t += LEN(k) + gap; return s; }
const wait = (s, n) => (s.t += n, s);
const fx = (s, name, rel) => (s.sfx.push([rel ?? s.t, name]), s);
const envAt = (k, lf) => { const v = window.VENV && VENV[k]; return v && lf >= 0 && lf < v.length ? v[Math.floor(lf)] : 0; };
// the latest clip (of keys) that has started by scene frame f
function cur(s, f, keys) {
  let k = null; for (const q of keys) if (s.at[q] != null && f >= s.at[q]) k = q;
  if (!k) return { k: keys[0], lf: f - s.at[keys[0]], p: 0, on: false, started: false };
  const lf = f - s.at[k], L = LEN(k); return { k, lf, p: clamp01(lf / L), on: lf < L, started: true };
}
// word highlight proportional to character count (clips carry a little lead/tail silence)
function litCount(ws, p) {
  const tot = ws.reduce((a, w) => a + w.length + 1, 0), q = clamp01((p - .04) / .88); let acc = 0, n = 0;
  if (q <= 0) return 0; for (const w of ws) { if (q * tot >= acc) n++; acc += w.length + 1; } return n;
}
function subtitle(str, cx, y, maxW, p, col, o = {}) {
  const { size = 34, weight = 600, font = SANS, lh = 1.3, op = 1 } = o;
  const lines = wrap(str, maxW, size, weight, font), all = lines.flat(), lit = litCount(all, p), done = p >= 1;
  const sp = measure(' ', size, weight, font); let idx = 0, out = '';
  const y0 = y - (lines.length - 1) * size * lh / 2;
  lines.forEach((ln, li) => {
    const ws = ln.map(w => measure(w, size, weight, font)); let x = cx - (ws.reduce((a, b) => a + b, 0) + sp * (ln.length - 1)) / 2;

  Math.random = () => { sd = (sd + 0x6D2B79F5) | 0; let t = Math.imul(sd ^ sd >>> 15, 1 | sd); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  try { return await renderSoundtrack(); } finally { Math.random = rnd0; }
}
async function renderSoundtrack() {
  const SR = 48000, ctx = new OfflineAudioContext(2, Math.ceil(TOTAL / FPS * SR), SR), keep = AU.ctx;
  AU.ctx = ctx; AU.live = []; await audioSetup(ctx);
  VO_CUES.forEach(([k, at, kind]) => { AU.at = at / FPS; playClip(k, kind, 0); });
  SFX_CUES.forEach(([at, n]) => { AU.at = at / FPS; sfx(n); });
  AU.at = null;
  const buf = await ctx.startRendering(); AU.ctx = keep; AU.live = [];
  const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1), dv = new DataView(new ArrayBuffer(44 + n * 4));
  const ws = (o, str) => [...str].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  ws(0, "RIFF"); dv.setUint32(4, 36 + n * 4, true); ws(8, "WAVEfmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, "data"); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { dv.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); dv.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  const u = new Uint8Array(dv.buffer); let bin = ""; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(bin);
}
function audioStop() { AU.live.forEach(n => { try { n.stop(); } catch (e) {} }); AU.live = []; }
function audioSeek(F) {
  if (!AU.ctx || !AU.on) return; audioStop();
  VO_CUES.forEach(([k, at, kind]) => { if (F >= at) playClip(k, kind, (F - at) / FPS); });
}
function audioStep(prev, F) {
  if (!AU.ctx || !AU.on || AU.ctx.state !== 'running') return;
  VO_CUES.forEach(([k, at, kind]) => { if (prev < at && F >= at) playClip(k, kind, (F - at) / FPS); });
  SFX_CUES.forEach(([at, n]) => { if (prev < at && F >= at && F - at < 6) sfx(n); });
}
const stage = document.getElementById('stage');
const scrub = document.getElementById('scrub'); scrub.max = TOTAL - 1;
const timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
let frame = 0, playing = true, last = null;

function render(F) {
  const s = SCENES.find(s => F >= s.from && F < s.from + s.dur) || SCENES[SCENES.length - 1];
  GF = F; stage.innerHTML = DEFS + '<defs>' + CP_DEFS + XDEFS + '</defs>' + s.render(F - s.from, s.dur);
  scrub.value = F; timeEl.textContent = (F / FPS).toFixed(1) + 's / ' + (TOTAL / FPS).toFixed(1) + 's';
}
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${k})`; }
function tick(ts) {
  if (playing) {
    if (last == null) last = ts;
    const elapsed = (ts - last) / (1000 / FPS);
    if (elapsed >= 1) { const pf = frame; frame += Math.floor(elapsed); last = ts; audioStep(pf, frame); }
    if (frame >= TOTAL) { frame = TOTAL - 1; playing = false; playBtn.textContent = 'Play'; audioStop(); }
    render(frame);
  }
  requestAnimationFrame(tick);
}
async function toggle() { playing = !playing; last = null; if (playing && frame >= TOTAL - 1) frame = 0; playBtn.textContent = playing ? 'Pause' : 'Play'; hideStart(); if (playing) { await audioInit(); audioSeek(frame); } else audioStop(); }
async function restart() { frame = 0; last = null; playing = true; playBtn.textContent = 'Pause'; hideStart(); await audioInit(); audioSeek(0); }
playBtn.onclick = toggle;
document.getElementById('restart').onclick = restart;
scrub.oninput = () => { audioStop(); playing = false; playBtn.textContent = 'Play'; frame = +scrub.value; render(frame); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.key === 'r' || e.key === 'R') restart();
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
  if (e.key === 'm' || e.key === 'M') { AU.on = !AU.on; if (AU.on) audioSeek(frame); else audioStop(); document.getElementById('mute').textContent = AU.on ? 'Sound on' : 'Muted'; }
});
addEventListener('resize', fit); fit();

const q = new URLSearchParams(location.search);
if (q.has('frame')) { playing = false; document.body.classList.add('clean'); frame = +q.get('frame'); render(frame); }
else { if (q.has('clean')) document.body.classList.add('clean'); playing = false; playBtn.textContent = 'Play'; render(0); document.getElementById('start').style.display = 'flex'; }
function hideStart() { document.getElementById('start').style.display = 'none'; }
document.getElementById('start').onclick = () => toggle();
document.getElementById('mute').onclick = () => dispatchEvent(new KeyboardEvent('keydown', { key: 'm' }));
requestAnimationFrame(tick);
</script>
