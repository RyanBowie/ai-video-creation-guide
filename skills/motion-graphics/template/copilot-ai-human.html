<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Copilot — AI accelerates. Humans create.</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { flex: none; width: 1920px; height: 1080px; transform-origin: center; }
  #hud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
         font: 13px "Segoe UI", sans-serif; color: #ccc; background: rgba(20,20,30,.85); padding: 8px 14px; border-radius: 10px; z-index: 10; }
  #hud button { background: #2a2a3a; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #hud input { width: 360px; }
  body.clean #hud { display: none; }
  #start { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; font: 600 28px "Segoe UI", sans-serif; color: #F3EFE6; background: rgba(11,14,26,.55); cursor: pointer; letter-spacing: .02em; }
</style>
</head>
<body>
<div id="start">&#9654;&nbsp; Click or press Space to play with sound</div>
<div id="wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg></div>
<div id="hud">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" value="0" />
  <span id="time">0.0s</span>
  <button id="mute">Sound on</button>
  <span style="opacity:.6">Space play/pause · R restart · M mute · H hide controls · F11 fullscreen</span>
</div>
<script src="voice.js"></script>
<script>
// ============================================================ constants
const W = 1920, H = 1080, FPS = 30;
const COL = {
  night: '#0B0E1A', panel: '#151A2E', line: '#2A3150', light: '#F3EFE6', muted: '#8C93AD',
  parch: '#F1E6CF', parch2: '#E6D6B4', ink: '#2B2118', red: '#A23B2A', gold: '#FFC857',
  teal: '#2EC4B6', pink: '#F25C9C', wood: '#8B5A2B', steel: '#8A8F9C',
};
const SANS = "'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif";
const SERIF = "'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif";
const MONO = "'Cascadia Code',Consolas,monospace";

// ============================================================ maths / easing
const clamp01 = t => Math.max(0, Math.min(1, t));
const mix = (a, b, t) => a + (b - a) * t;
const mixP = (p, q, t) => [mix(p[0], q[0], t), mix(p[1], q[1], t)];
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (f, a, b, e) => { const t = clamp01((f - a) / (b - a)); return e ? e(t) : t; };
function spring(fr, { damping = 12, stiffness = 170, mass = 1 } = {}) {
  if (fr <= 0) return 0;
  let x = 0, v = 0; const steps = Math.ceil(fr * 4), dt = fr / FPS / steps;
  for (let i = 0; i < steps; i++) { const a = (-stiffness * (x - 1) - damping * v) / mass; v += a * dt; x += v * dt; }
  return x;
}
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const n1 = v => (+v).toFixed(1);
const n3 = v => (+v).toFixed(3);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const quad = (a, c, b, t) => { const u = 1 - t; return [u*u*a[0] + 2*u*t*c[0] + t*t*b[0], u*u*a[1] + 2*u*t*c[1] + t*t*b[1]]; };
const quadD = (a, c, b, t) => [2*(1-t)*(c[0]-a[0]) + 2*t*(b[0]-c[0]), 2*(1-t)*(c[1]-a[1]) + 2*t*(b[1]-c[1])];
function limb(a, ang, len) { const r = ang * Math.PI / 180; return [a[0] + Math.sin(r) * len, a[1] + Math.cos(r) * len]; }
function ik(a, b, l1, l2, bend = -1) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d = Math.max(1e-3, Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01));
  const c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
  const t = Math.atan2(dy, dx) - bend * Math.acos(Math.max(-1, Math.min(1, c)));
  return [a[0] + Math.cos(t) * l1, a[1] + Math.sin(t) * l1];
}
function segX(a, b, c, d) {
  const r = [b[0]-a[0], b[1]-a[1]], s = [d[0]-c[0], d[1]-c[1]];
  const den = r[0]*s[1] - r[1]*s[0]; if (Math.abs(den) < 1e-6) return null;
  const t = ((c[0]-a[0])*s[1] - (c[1]-a[1])*s[0]) / den, u = ((c[0]-a[0])*r[1] - (c[1]-a[1])*r[0]) / den;
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? [a[0] + t*r[0], a[1] + t*r[1]] : null;
}

// ============================================================ text + path helpers
const mctx = document.createElement('canvas').getContext('2d');
function measure(str, size, weight, font, italic) { mctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${font}`; return mctx.measureText(str).width; }

// Word-by-word staggered reveal. segs: [{t, fill?, italic?}]
function words(segs, cx, y, f, delay, o = {}) {
  const { size = 64, weight = 600, font = SANS, stagger = 3, dur = 18, dist = 30, op = 1 } = o;
  const items = [];
  segs.forEach(sg => sg.t.split(' ').forEach(w => { if (w) items.push({ w, fill: sg.fill || o.fill || COL.light, italic: sg.italic ?? o.italic ?? false }); }));
  const sp = measure(' ', size, weight, font, false);
  const widths = items.map(it => measure(it.w, size, weight, font, it.italic));
  let x = cx - (widths.reduce((a, b) => a + b, 0) + sp * (items.length - 1)) / 2;
  let out = '';
  items.forEach((it, i) => {
    const t = prog(f, delay + i * stagger, delay + i * stagger + dur, eout);
    if (t > 0) out += `<text x="${n1(x)}" y="${n1(y + (1 - t) * dist)}" opacity="${n3(t * op)}" font-family="${font}" font-size="${size}" font-weight="${weight}" fill="${it.fill}"${it.italic ? ' font-style="italic"' : ''}>${esc(it.w)}</text>`;
    x += widths[i] + sp;
  });
  return out;
}
function stroke(d, t, attrs = '') {
  if (t <= 0) return '';
  return `<path d="${d}" fill="none" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${n3(1 - t)}" ${attrs}/>`;
}
const svgNS = 'http://www.w3.org/2000/svg';
const hidden = document.createElementNS(svgNS, 'svg');
hidden.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden';
document.body.appendChild(hidden);
const pathCache = new Map();
function pointAt(d, t) {
  let p = pathCache.get(d);
  if (!p) { p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', d); hidden.appendChild(p); p._len = p.getTotalLength(); pathCache.set(d, p); }
  const q = p.getPointAtLength(p._len * clamp01(t)); return [q.x, q.y];
}
function partial(d, t, n = 60) {
  const pts = []; for (let i = 0; i <= n; i++) { const q = pointAt(d, t * i / n); pts.push(n1(q[0]) + ',' + n1(q[1])); } return pts.join(' ');
}

// ============================================================ backgrounds
const DEFS = `<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".06"/></pattern></defs>`;
const bgNight = () => `<rect width="${W}" height="${H}" fill="${COL.night}"/><rect width="${W}" height="${H}" fill="url(#dots)"/>`;
const nightRect = (x, w) => w > 0 ? `<rect x="${n1(x)}" y="0" width="${n1(w)}" height="${H}" fill="${COL.night}"/><rect x="${n1(x)}" y="0" width="${n1(w)}" height="${H}" fill="url(#dots)"/>` : '';
const SPECKS = Array.from({ length: 70 }, (_, i) => `<circle cx="${n1(rnd(i) * W)}" cy="${n1(rnd(i + 99) * H)}" r="${n1(1 + rnd(i + 7) * 2.5)}" fill="${COL.ink}" opacity="${n3(0.04 + rnd(i + 3) * 0.06)}"/>`).join('');
const bgParch = () => `<rect width="${W}" height="${H}" fill="${COL.parch}"/>${SPECKS}`;
function stars(F, drift = 0) {
  let s = '';
  for (let i = 0; i < 120; i++) {
    const x = (((rnd(i) * W - drift * (0.3 + rnd(i + 5) * 0.7)) % W) + W) % W;
    const tw = .35 + .65 * Math.abs(Math.sin(F * 0.05 + i));
    s += `<circle cx="${n1(x)}" cy="${n1(rnd(i + 50) * H)}" r="${n1(0.8 + rnd(i + 9) * 1.8)}" fill="#fff" opacity="${n3(tw * .8)}"/>`;
  }
  return s;
}

// ============================================================ Microsoft 365 Copilot-style mark (two interlocking ribbons, 180° symmetric)
const CP_A = 'M70 325 L160 325 Q173 325 181 300 L216 185 Q224 155 250 155 L385 155 C350 155 348 110 340 82 C330 50 315 40 290 40 L150 40 Q115 40 105 75 L40 290 Q28 325 70 325 Z';
const CP_FOLD = 'M262 40 L290 40 C315 40 330 50 340 82 C348 110 350 155 385 155 L250 155 Q224 155 220 170 Q232 90 262 40 Z';
const CP_DEFS = `
<linearGradient id="cpA" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="110" y2="325"><stop offset="0" stop-color="#38C2F8"/><stop offset=".3" stop-color="#1C8FE3"/><stop offset=".62" stop-color="#4DB57A"/><stop offset="1" stop-color="#F7C51E"/></linearGradient>
<linearGradient id="cpAf" gradientUnits="userSpaceOnUse" x1="250" y1="60" x2="380" y2="150"><stop offset="0" stop-color="#0B2BA8"/><stop offset=".6" stop-color="#1552D6"/><stop offset="1" stop-color="#1E7BEA"/></linearGradient>
<linearGradient id="cpB" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="110" y2="325"><stop offset="0" stop-color="#FFB16A"/><stop offset=".38" stop-color="#F7738A"/><stop offset=".7" stop-color="#E4569A"/><stop offset="1" stop-color="#B04FE6"/></linearGradient>
<linearGradient id="cpBf" gradientUnits="userSpaceOnUse" x1="250" y1="60" x2="380" y2="150"><stop offset="0" stop-color="#C92E1C"/><stop offset=".55" stop-color="#F0582E"/><stop offset="1" stop-color="#FF9A5A"/></linearGradient>
<linearGradient id="cpGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="cpSheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cpClip"><path d="${CP_A}"/><path d="${CP_FOLD}"/><path d="${CP_A}" transform="rotate(180 240 240)"/><path d="${CP_FOLD}" transform="rotate(180 240 240)"/></clipPath>
<filter id="cpGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>`;
let GF = 0; // global frame, set by render() — drives the idle sheen
function mark(cx, cy, size, t = 1, spin = 0) {
  if (size <= 0.5) return '';
  const k = size / 360, e = eout(clamp01(t)), sep = mix(90, 0, e);
  const draw = prog(t, 0, .6, eio), fill = prog(t, .3, .9), fold = prog(t, .55, 1, eout);
  const half = (id, rot) => {
    const off = rot ? `translate(${n1(sep)} ${n1(sep * .55)})` : `translate(${n1(-sep)} ${n1(-sep * .55)})`;
    const R = rot ? ' rotate(180 240 240)' : '';
    return `<g transform="${off}${R}"><path d="${CP_A}" fill="url(#${id})" fill-opacity="${n3(fill)}" stroke="url(#${id})" stroke-width="10" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${n3(1 - draw)}"/><path d="${CP_A}" fill="url(#cpGloss)" opacity="${n3(fill * .7)}"/><path d="${CP_FOLD}" fill="url(#${id}f)" opacity="${n3(fold)}"/></g>`;
  };
  const sweep = ((GF % 150) / 150) * 900 - 250;
  const sheen = t >= 1 ? `<g clip-path="url(#cpClip)"><rect x="${n1(sweep)}" y="-40" width="160" height="560" fill="url(#cpSheen)" transform="rotate(20 240 240)" opacity=".6"/></g>` : '';
  const glow = `<g filter="url(#cpGlow)" opacity="${n3(.35 * fill)}"><path d="${CP_A}" fill="url(#cpA)"/><path d="${CP_A}" fill="url(#cpB)" transform="rotate(180 240 240)"/></g>`;
  return `<g transform="translate(${n1(cx)} ${n1(cy)}) rotate(${n1(spin)}) scale(${n3(k)}) translate(-240 -240)">${size > 120 ? glow : ''}${half('cpA', false)}${half('cpB', true)}${sheen}</g>`;
}function companion(x, y, size, F) {
  let c = `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(Math.min(size * 1.9, 200))}" fill="${COL.light}" opacity=".05"/><circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(Math.min(size * 1.15, 160))}" fill="${COL.light}" opacity=".06"/>`;
  for (let k = 1; k < 7; k++) c += `<circle cx="${n1(x - k * 18 * size / 70)}" cy="${n1(y + Math.sin(F * .2 - k * .8) * 8)}" r="${n1((5 - k * .6) * size / 70)}" fill="${['#1C8FE3', '#E4569A', '#F7C51E'][k % 3]}" opacity="${n3(.6 - k * .08)}"/>`;
  return c + mark(x, y, size, 1, Math.sin(F * .05) * 10);
}

// ============================================================ stick figure rig
// Local space faces right, ground at y=0. Angles: 0 = down, 90 = forward, 180 = up.
function figure(o) {
  const { x, y, s = 1, dir = 1, color = COL.light, kind = 'plain', op = 1 } = o;
  const p = { lean: 0, aSh: -8, aEl: 18, bSh: 10, bEl: 18, aHip: 5, aKnee: 0, bHip: -5, bKnee: 0, bob: 0, head: 0, ...(o.pose || {}) };
  if (o.walk != null) {
    const amt = o.walkAmt ?? 1, w = Math.sin(o.walk), c = Math.cos(o.walk);
    p.aHip = mix(p.aHip, 26 * w, amt); p.bHip = mix(p.bHip, -26 * w, amt);
    p.aKnee = mix(p.aKnee, 34 * Math.max(0, c), amt); p.bKnee = mix(p.bKnee, 34 * Math.max(0, -c), amt);
    if (!o.holdArm) { p.aSh = mix(p.aSh, -22 * w, amt); p.aEl = mix(p.aEl, 20, amt); }
    p.bSh = mix(p.bSh, 22 * w, amt); p.bEl = mix(p.bEl, 20, amt);
    p.bob = mix(p.bob, -5 * Math.abs(c), amt); p.lean = mix(p.lean, 5, amt);
  }
  const hip = [0, -84 + p.bob], up = 180 - p.lean;
  const neck = limb(hip, up, 62), sh = limb(hip, up, 54), hd = limb(neck, up - p.head, 21);
  const G = q => [x + dir * s * q[0], y + s * q[1]];
  const off = (q, dx, dy) => [q[0] + dx, q[1] + dy];
  const P = q => n1(q[0]) + ' ' + n1(q[1]);
  const PL = (a, extra = '') => `<polyline points="${a.map(q => n1(q[0]) + ',' + n1(q[1])).join(' ')}"${extra}/>`;
  const pts = {};

  if (kind === 'dwarf' && !p.aHand) p.aHand = off(sh, 18, 22);
  let aimU = null;
  if (o.aim != null) { const r = o.aim * Math.PI / 180; aimU = [Math.cos(r), Math.sin(r)]; p.aHand = [sh[0] + aimU[0] * 62, sh[1] + aimU[1] * 62]; }
  const arm = k => { const t = p[k + 'Hand']; if (t) return [ik(sh, t, 34, 32), t]; const e = limb(sh, p[k + 'Sh'], 34); return [e, limb(e, p[k + 'Sh'] + p[k + 'El'], 32)]; };
  const [aE, aH] = arm('a');

  let back = '', mid = '', cloak = '', over = '', front = '';
  let bowR = null, nock = null;
  if (aimU) {
    const v = [-aimU[1], aimU[0]];
    bowR = (a, b) => [aH[0] + aimU[0] * a + v[0] * b, aH[1] + aimU[1] * a + v[1] * b];
    nock = bowR(-18 - (o.draw || 0) * 58, 0); p.bHand = nock; pts.nock = G(nock);
  }
  if (o.saber && o.twoHand) p.bHand = limb(aH, o.saber.ang + 180, 12);
  const [bE, bH] = arm('b');
  const leg = k => { const th = p[k + 'Hip'], kn = p[k + 'Knee']; const kk = limb(hip, th, 42); return [kk, limb(kk, th - kn, 42)]; };
  const [aK, aF] = leg('a'), [bK, bF] = leg('b');
  const sway = o.sway || 0;

  if (kind === 'gandalf') {
    const robe = o.robe || color, beard = o.beard || color, wood = o.staffCol || '#B8895A', sw = sway;
    // flared grey robe with a swaying hem and rope belt
    cloak += `<path d="M${P(off(neck, -11, 4))} L${P(off(neck, 11, 4))} L${P(off(hip, 30 - sw * .5, 64))} Q${P(off(hip, 14 - sw * .5, 72))} ${P(off(hip, -sw * .5, 64))} Q${P(off(hip, -16 - sw * .5, 58))} ${P(off(hip, -30 - sw * .5, 66))} Z" fill="${robe}" stroke="none"/>`;
    cloak += PL([off(hip, -17, -8), off(hip, 17, -8)], ' stroke="#D9C49A" stroke-width="4"') + PL([off(hip, 10, -8), off(hip, 13 - sw * .3, 16)], ' stroke="#D9C49A" stroke-width="3"');
    // long white beard
    over += `<path d="M${P(off(hd, -5, 6))} Q${P(off(hd, -9 + sw * .3, 42))} ${P(off(hd, 6 + sw * .6, 74))} Q${P(off(hd, 18, 42))} ${P(off(hd, 18, 4))} Q${P(off(hd, 6, 12))} ${P(off(hd, -5, 6))} Z" fill="${beard}" stroke="none"/>`;
    // tall hat with a drooping tip + wide brim
    over += `<path d="M${P(off(hd, -16, -9))} C${P(off(hd, -12, -36))} ${P(off(hd, -8, -56))} ${P(off(hd, -12, -68))} Q${P(off(hd, -18, -84))} ${P(off(hd, -34 + sw, -86))} Q${P(off(hd, -2, -78))} ${P(off(hd, 4, -60))} C${P(off(hd, 8, -40))} ${P(off(hd, 14, -24))} ${P(off(hd, 17, -9))} Z" fill="${robe}" stroke="none"/>`;
    over += `<ellipse cx="${n1(hd[0])}" cy="${n1(hd[1] - 10)}" rx="38" ry="7" fill="${robe}" stroke="none"/>`;
    // gnarled wooden staff with a crook cradling the light
    const sa = o.staffAng ?? 5, top = limb(aH, 180 - sa, 92), bot = limb(aH, -sa, 100), gl = o.glow || 0, orb = off(top, 6, -18);
    pts.staffTop = G(orb); pts.staffBot = G(bot);
    front += PL([bot, top], ` stroke="${wood}" stroke-width="7"`);
    front += `<path d="M${P(top)} c-12 -10 -10 -36 8 -38 c16 -2 22 14 12 24" stroke="${wood}" stroke-width="6"/>`;
    if (gl > 0) front += `<circle cx="${n1(orb[0])}" cy="${n1(orb[1])}" r="${n1(12 + gl * 70)}" fill="${COL.gold}" opacity="${n3(.1 * gl)}" stroke="none"/><circle cx="${n1(orb[0])}" cy="${n1(orb[1])}" r="${n1(10 + gl * 32)}" fill="${COL.gold}" opacity="${n3(.25 * gl)}" stroke="none"/>`;
    front += `<circle cx="${n1(orb[0])}" cy="${n1(orb[1])}" r="8" fill="${gl > .05 ? COL.gold : '#E8E2D0'}" stroke="none"/>`;
  }
  if (kind === 'legolas') {
    const hair = o.hair || '#D9B44A', tunic = o.tunic || '#5B8C4E';
    // long straight blond hair flowing behind
    back += `<path d="M${P(off(hd, -15, -10))} Q${P(off(hd, -28 + sway * .4, 22))} ${P(off(hd, -22 + sway, 60))} L${P(off(hd, -8 + sway * .7, 56))} Q${P(off(hd, -6, 16))} ${P(off(hd, 8, -16))} Z" fill="${hair}" stroke="none"/>`;
    // quiver with red fletchings
    back += PL([off(sh, -16, -12), off(sh, -4, 52)], ` stroke="${COL.wood}" stroke-width="13"`);
    back += `<path d="M${P(off(sh, -24, -26))} l6 8 l6 -8 M${P(off(sh, -14, -28))} l5 8 l6 -7" stroke="${COL.red}" stroke-width="4"/>`;
    // green tunic + belt
    mid += `<path d="M${P(off(neck, -9, 8))} L${P(off(neck, 9, 8))} L${P(off(hip, 17, 24))} L${P(off(hip, -17, 24))} Z" fill="${tunic}" stroke="none"/>` + PL([off(hip, -14, 2), off(hip, 14, 2)], ` stroke="${COL.wood}" stroke-width="4"`);
    // hair cap + pointed elf ear
    over += `<path d="M${P(off(hd, -17, 0))} A17 17 0 0 1 ${P(off(hd, 16, -6))} Q${P(off(hd, 2, -10))} ${P(off(hd, -17, 0))} Z" fill="${hair}" stroke="none"/>`;
    over += `<path d="M${P(off(hd, -3, 4))} L${P(off(hd, -27, -12))} L${P(off(hd, -8, 7))} Z" fill="${color}" stroke="none"/>`;
    if (!aimU) back += `<path d="M${P(off(sh, -32, -40))} Q${P(off(sh, -60, 20))} ${P(off(sh, -28, 78))}" stroke-width="5"/>`;
    else {
      const t1 = bowR(-18, -54), t2 = bowR(-18, 54), cp = bowR(22, 0);
      front += `<path d="M${P(t1)} Q${P(cp)} ${P(t2)}" stroke-width="6"/>` + PL([t1, nock, t2], ' stroke-width="2"');
      if (o.arrow) {
        const T = [nock[0] + aimU[0] * 112, nock[1] + aimU[1] * 112], v = [-aimU[1], aimU[0]];
        front += PL([nock, T], ` stroke="${COL.wood}" stroke-width="4"`);
        front += `<path d="M${P(T)} L${P([T[0] - aimU[0] * 14 + v[0] * 7, T[1] - aimU[1] * 14 + v[1] * 7])} L${P([T[0] - aimU[0] * 14 - v[0] * 7, T[1] - aimU[1] * 14 - v[1] * 7])} Z" fill="${COL.steel}" stroke="none"/>`;
      }
    }
  }
